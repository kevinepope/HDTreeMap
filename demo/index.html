<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b1b" />
    <meta
      name="description"
      content="HDTreeMap: a disk-usage treemap viewer built on agg-gui, running in the browser on simulated drives."
    />
    <title>HDTreeMap — disk usage treemap (demo)</title>
    <style>
      /* Bootstrap-only styling. All visible UI is painted by agg-gui into the canvas
         (CLAUDE.md: all UI through agg-gui). This page only places the canvas. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #1b1b1b;
        overflow: hidden;
        height: 100%;
        height: 100dvh;
        width: 100%;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #hdtreemap-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="hdtreemap-canvas" tabindex="0"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
