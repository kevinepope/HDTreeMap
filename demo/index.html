<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ebebf2" />
    <meta
      name="description"
      content="HDTreeMap: a small, fast disk-usage treemap viewer for macOS, Windows and Linux, built in Rust on agg-gui. This live demo scans simulated drives in your browser."
    />
    <title>HDTreeMap — disk usage treemap viewer (live demo)</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HDTreeMap — disk usage treemap viewer" />
    <meta
      property="og:description"
      content="See what fills your disk: a cushion treemap with a linked folder tree and file-type legend. Native for macOS, Windows and Linux; this demo runs on simulated drives."
    />
    <meta property="og:url" content="https://larsbrubaker.github.io/HDTreeMap/" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/larsbrubaker/HDTreeMap/main/readme_hero.png"
    />
    <meta property="og:image:width" content="1800" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Bootstrap-only styling. All visible UI is painted by agg-gui into the canvas
         (CLAUDE.md: all UI through agg-gui). This page only places the canvas. */
      html,
      body {
        margin: 0;
        padding: 0;
        /* The app's light panel colour, so nothing flashes before the first frame. */
        background: #ebebf2;
        overflow: hidden;
        height: 100%;
        height: 100dvh;
        width: 100%;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #hdtreemap-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
        outline: none;
      }
      html.hdtreemap-dark,
      html.hdtreemap-dark body {
        background: #212126;
      }
    </style>
    <script>
      // Before the first paint: match the page to the remembered theme (the app's
      // localStorage blob, "hdtreemap.settings"; light when there is none), so a dark
      // choice does not flash light while the wasm loads. No visible UI here.
      (function () {
        var theme = "light";
        try {
          var blob = JSON.parse(localStorage.getItem("hdtreemap.settings") || "{}");
          if (blob && typeof blob.theme === "string") theme = blob.theme;
        } catch (e) {}
        var dark =
          theme === "dark" ||
          (theme === "system" &&
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.className = "hdtreemap-dark";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#212126");
        }
      })();
    </script>
  </head>
  <body>
    <canvas id="hdtreemap-canvas" tabindex="0"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
