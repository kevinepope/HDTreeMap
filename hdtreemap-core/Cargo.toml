# hdtreemap-core: the target-agnostic heart of HDTreeMap. Everything testable lives here
# (state, formatting, the PlatformServices contract and its demo implementation, widgets).
# No platform code: the shells implement PlatformServices.
[package]
name = "hdtreemap-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Target-agnostic core of HDTreeMap, a disk-usage treemap viewer."

[dependencies]
agg-gui = { workspace = true }
# `Instant` that works on wasm32-unknown-unknown (std's panics there); agg-gui uses it too.
web-time = "1"
# Remembered settings (`settings.rs`): a small JSON blob in a file or localStorage.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["rlib"]

# The real-disk scanner (`scan::fs`) only exists natively: the browser cannot read disks.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Parallel directory walk on a rayon pool (the dua-cli scanner's walker).
jwalk = "0.8"
# Parallel row bands in the treemap rasteriser (the pool jwalk already brings in).
rayon = "1"

# Allocated ("size on disk") for compressed / sparse / cloud files on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
