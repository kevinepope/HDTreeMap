# HDTreeMap workspace: a disk-usage treemap viewer built on agg-gui (see CLAUDE.md, docs/PLAN.md).
#
# - hdtreemap-core   (rlib)   everything testable: model, scanning, layout, rendering, widgets.
# - hdtreemap-native (bin)    the desktop shell (agg-gui-shell) plus the real PlatformServices.
# - hdtreemap-wasm   (cdylib) the browser shell (agg-gui-web-shell) running the demo platform.
#
# hdtreemap-wasm is a member (so clippy/fmt cover it) but not a default member: it only does
# something on wasm32, and `cargo run` should pick the native binary.
[workspace]
resolver = "2"
members = ["hdtreemap-core", "hdtreemap-native", "hdtreemap-wasm"]
default-members = ["hdtreemap-core", "hdtreemap-native"]

[workspace.package]
version = "0.1.1"
edition = "2021"
# The highest rust-version among the locked dependencies: sysinfo 0.39 requires 1.95
# (wgpu 29, under agg-gui-shell / agg-gui-web-shell, needs 1.87).
rust-version = "1.95"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
license = "MIT"
repository = "https://github.com/larsbrubaker/HDTreeMap"
homepage = "https://larsbrubaker.github.io/HDTreeMap/"
readme = "README.md"
keywords = ["disk-usage", "treemap", "du", "gui", "agg-gui"]
categories = ["filesystem", "visualization", "gui"]

[workspace.dependencies]
agg-gui = "0.5.1"
# Published native shell (winit event loop + wgpu present + input plumbing).
agg-gui-shell = "0.5.2"
# Turn-key browser shell. Not published to crates.io yet, so it is a path dependency on the
# sibling agg-gui checkout (CI clones it there too).
agg-gui-web-shell = { path = "../agg-gui/agg-gui-web-shell" }

# ---------------------------------------------------------------------------
# Local development override — see CLAUDE.md "Local development uses agg-gui
# as a path dep". The rust-apps superproject lays out agg-gui as a sibling.
# CI clones it the same way so these patches resolve both locally and in Actions.
# ---------------------------------------------------------------------------
[patch.crates-io]
agg-gui = { path = "../agg-gui/agg-gui" }
agg-gui-shell = { path = "../agg-gui/agg-gui-shell" }

# ---------------------------------------------------------------------------
# Debug-build optimization. BOTH sections are required (see the comment in
# agg-gui/Cargo.toml). `[profile.dev.package."*"]` applies to dependencies
# only; agg-gui's generic / #[inline] rendering code is monomorphized into the
# *calling* crate and inherits that crate's opt-level, so workspace members
# need `opt-level = 1` or the dependency override is defeated in the hottest
# code path.
# ---------------------------------------------------------------------------
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
